# Static serving for the Arkade Heroes Blazor WebAssembly bundle.
# Port 8080, not 80: this runs under nginx-unprivileged as uid 101, which cannot bind
# a privileged port. Mapped to a host port by docker-compose.yml.

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # DO NOT add a `types { … }` block here. An earlier revision of this file declared one
    # to pin application/wasm, and it broke the whole app: a types block REPLACES the
    # inherited MIME map rather than extending it, so text/html was lost and index.html
    # went out as application/octet-stream — which a browser downloads instead of renders.
    # None of it was needed. The base image's /etc/nginx/mime.types (included at http level
    # in nginx.conf) already maps wasm→application/wasm, html, js and json, and its
    # `default_type application/octet-stream` is already the right answer for the runtime's
    # .dat/.blat blobs.

    # The publish output contains pre-compressed .gz siblings; serve them instead of
    # gzipping ~30 MB of runtime on every request. Falls through when one is absent.
    gzip_static on;
    gzip         on;
    gzip_types   text/plain text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;

    # ── Cache policy ────────────────────────────────────────────────────────
    # These two decide WHICH bundle the browser loads. Cache them and a deploy is
    # invisible until the user hard-refreshes — they must always be revalidated.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location = /appsettings.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    # Everything under _framework is content-fingerprinted by the .NET 10 Blazor SDK
    # (dotnet.s7w3wm3ylz.js, ArkadeHeroes.Web.rgxp7gxboe.wasm, …) — verified: all 135
    # published assets carry a hash, and the unhashed names that appear in index.html are
    # importmap KEYS that 404 on disk and are never fetched. A changed file therefore gets
    # a changed name, so this is safe to cache hard. index.html above is the single
    # invalidation root: it is never cached, and it carries the fingerprint map.
    # (There is no blazor.boot.json to special-case — .NET 10 folds the boot config into
    # the fingerprinted dotnet.js.)
    location /_framework/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ── SPA fallback ────────────────────────────────────────────────────────
    # Blazor routes (/heroes, /market, /terms …) exist only client-side; a deep link or a
    # refresh must return index.html rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # No health endpoint in a static bundle, so give the compose healthcheck a cheap one
    # that does not pull the whole index page.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
