name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # Nightly, for the E2E job only — it is the one job left that cannot gate a PR, because it
  # needs the regtest docker stack. Three death-match E2Es sat red for weeks because E2E ran
  # on manual dispatch alone, so nothing on push or PR ever exercised them.
  schedule:
    - cron: '17 4 * * *'   # 04:17 UTC — off the hour, where runner contention is lower

jobs:
  build-and-unit-test:
    name: Build + unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules — brings the NArk SDK the game builds against)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0   # Nerdbank.GitVersioning needs full history to compute the version height

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The Blazor WASM frontend (ArkadeHeroes.Web) sets WasmBuildNative, so the
      # whole-solution build below needs the wasm-tools workload on the runner.
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Restore
        run: dotnet restore ArkadeHeroes.slnx

      - name: Build (Release, whole solution — catches compile errors in every project)
        run: dotnet build ArkadeHeroes.slnx --configuration Release --no-restore

      # The unit/integration suite runs entirely against the in-memory chain
      # (WebApplicationFactory + InMemoryChainService), so it needs NO regtest
      # stack — this is the gate that guards every push.
      - name: Unit tests
        run: >
          dotnet test tests/ArkadeHeroes.Tests
          --configuration Release --no-build
          --logger "trx;LogFileName=unit.trx"
          --results-directory TestResults

      # Renders the Blazor pages in-process (bUnit). No browser, no server, no Docker — it is
      # about as fast as the unit suite, so it gates every PR alongside it. This is the gate
      # that would have caught a Send form drawn at zero balance, an empty-state that claimed
      # the player owned nothing when the read had merely failed, and an accepted match that
      # fell through every bucket on the defender's page. See tests/ArkadeHeroes.Tests.Web/README.md.
      - name: Component render tests (bUnit)
        run: >
          dotnet test tests/ArkadeHeroes.Tests.Web
          --configuration Release --no-build
          --logger "trx;LogFileName=web.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: TestResults/*.trx

  # ── Published-bundle browser suite — EVERY PR ──────────────────────────────
  # Publishes the WASM frontend and drives the REAL bundle in Chromium. This is the only
  # gate that sees what a player downloads: IL linking, the boot manifest, static
  # initializers, JS interop. It exists because a static initializer once threw on startup
  # and blanked every page that touches the content pack (the crash #207 finally pinned on
  # a cycle in ContentPackVersion) while a local build and the whole unit suite stayed
  # green — nothing in them ever started the app.
  #
  # It now also walks the whole game against a REAL ArkadeHeroes.Server on the in-memory
  # chain — every route, its console, its prices and its empty states. See that suite's
  # README for what it reaches and where it stops.
  #
  # ON THE PR GATE as of this change, reversing the earlier call. Two things moved:
  #
  #   • What it costs, MEASURED rather than assumed. This is a separate JOB, so it runs in
  #     PARALLEL with the unit job rather than after it, and a PR's wall clock is the slower
  #     leg rather than the sum. On the run that introduced it (30673219593) the unit job
  #     took 2m30s and this one 5m38s, so it IS the slower leg and it roughly doubles PR
  #     latency. That is the real price; 5-6 minutes is still a reasonable gate, and the
  #     earlier estimate that the publish costs "minutes" on its own was pessimistic.
  #   • What it catches. It used to assert that pages draw with every backend unreachable,
  #     which is worth little on a push. It now fails on a page that renders while throwing
  #     in the console, on a price that disagrees with the server's config, and on an empty
  #     state standing in for a failed read — regressions a reviewer cannot see in a diff.
  #
  # Needs no infrastructure: no Docker, no arkd, no bitcoind. That is what makes gating
  # defensible, and it is the difference between this job and the E2E one below. The repo's
  # own history is the argument: three E2Es sat red for weeks behind a manual-dispatch gate.
  # If this job turns out to be the long pole on PR latency, moving it back is one `if:`.
  browser-test:
    name: Browser suite (published bundle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules — brings the NArk SDK the game builds against)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0   # Nerdbank.GitVersioning needs full history to compute the version height

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      # Published ONCE here rather than by the fixture, so the artifact under test is visible
      # in the log and a publish failure is reported as a publish failure, not a test timeout.
      - name: Publish the frontend (Release — the configuration that actually ships)
        run: dotnet publish src/ArkadeHeroes.Web -c Release -o published-web

      - name: Build the browser suite
        run: dotnet build tests/ArkadeHeroes.Tests.Browser --configuration Release

      - name: Install Chromium
        run: pwsh tests/ArkadeHeroes.Tests.Browser/bin/Release/net10.0/playwright.ps1 install chromium --with-deps

      - name: Browser suite (boot smoke + full arena walk)
        env:
          # ABSOLUTE. `dotnet test` runs the test host with its own working directory (the
          # assembly's output folder), not the repository root, so a relative path here
          # resolved to nothing and every test failed on a missing wwwroot.
          ARKADE_WEB_PUBLISH_DIR: ${{ github.workspace }}/published-web
        run: >
          dotnet test tests/ArkadeHeroes.Tests.Browser
          --configuration Release --no-build
          --logger "trx;LogFileName=browser.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: TestResults/*.trx

  # ── E2E on live regtest — MANUAL (workflow_dispatch) + NIGHTLY (schedule) ───
  # The E2E suite drives real arkd + the Arkade Script emulator over the
  # arkade-regtest docker stack. It is opt-in because it needs Docker, is slow
  # (~2.5 min), and shares a faucet (the tests already run serially). This job is
  # verified green in Actions on 2026-07-22 (run 29959028986, 581s), which is why it
  # is now also scheduled nightly rather than manual-only.
  e2e-test:
    name: E2E (regtest)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - name: Checkout (recursive — also brings the arkade-regtest harness)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0   # Nerdbank.GitVersioning needs full history to compute the version height

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node (runs the regtest harness)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The E2E suite references ArkadeHeroes.Web, so that the BROWSER wallet's coin selection can be
      # driven against a real arkd — the console wallet has its own, and the browser path is the one
      # where picking the wrong coin sends a player's hero to the fee address. ArkadeHeroes.Web sets
      # WasmBuildNative, so building it needs this workload, exactly as the unit-test job does.
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Start the Arkade regtest stack (arkd + emulator + bitcoin)
        run: node regtest/regtest.mjs start --profile ark --profile emulator

      - name: Wait for arkd to report ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:7070/v1/info > /dev/null; then
              echo "arkd is up"; exit 0
            fi
            echo "waiting for arkd ($i)…"; sleep 5
          done
          echo "arkd did not become ready in time"; exit 1

      - name: E2E tests (serial — shared faucet)
        run: dotnet test tests/ArkadeHeroes.Tests.E2E --configuration Release

      - name: Tear down the regtest stack
        if: always()
        run: node regtest/regtest.mjs stop || true
