# Arkade Heroes on Dokploy — MUTINYNET, built from source.
#
# Dokploy → Create **Compose** (not Application: an Application is one container, this is
# three) → Provider **Git** → this repo → Compose Path `deploy/dokploy/compose.yml`.
#
# ── TWO SETTINGS THAT ARE NOT OPTIONAL ───────────────────────────────────────
# 1. **Enable Submodules: ON.** Both Dockerfiles `COPY external/dotnet-sdk/...` directly,
#    so without the submodule the build fails at COPY. It fails loudly rather than
#    producing a broken image, which is the good outcome — but it will not build at all.
# 2. **Build Type: Dockerfile**, not Nixpacks. Nixpacks cannot build a .NET solution with
#    two service Dockerfiles and will guess wrong.
#
# ── CONTINUOUS DEPLOY ────────────────────────────────────────────────────────
# Dokploy's git **Autodeploy: ON** is exactly right here. Building from source has no
# registry round-trip, so there is no window in which Dokploy could deploy an older image
# than the commit that triggered it — push, build, run, in that order, from one clone.
#
# (The `deploy` job in .github/workflows/docker-publish.yml exists for the OTHER topology,
# where Dokploy pulls pre-built images and the push/publish ordering does race. Leave
# DOKPLOY_DEPLOY_WEBHOOK unset and that job skips harmlessly. CI still publishes images to
# GHCR either way, which is useful for rollback: pin `image:` to a tag instead of `build:`
# to pin a deployment to a known-good build.)
#
# ── BUILD COST, HONESTLY ─────────────────────────────────────────────────────
# The web image installs the wasm-tools workload and relinks the .NET runtime; on CI's
# runners that leg alone is ~3-5 minutes, and a small VPS will be slower. Give the builder
# real memory — Dokploy's own guidance is 4+ GB RAM and 2+ CPU, and .NET restore of this
# solution is memory-hungry. If builds OOM, that is the first thing to raise.
#
# ── ONE DOMAIN, ON PURPOSE ───────────────────────────────────────────────────
# The server's CORS policy allows only localhost origins and has no config hook, so a
# split web/api domain pair would be blocked in the browser. Routing BOTH under one host
# makes the browser origin equal to the API origin and CORS is never consulted:
#
#   heroes.example.com/      → web:8080
#   heroes.example.com/api   → server:8080
#
# The SDK appends "/api/..." to ApiBaseUrl, so API_BASE_URL is the bare origin.
# Set both rules in Dokploy → Domains (one per service, same host, different paths).

services:
  # ── Game API ──────────────────────────────────────────────────────────────
  server:
    build:
      # `../..` — NOT `.`. Compose resolves a build context relative to the COMPOSE FILE's
      # directory, and both Dockerfiles expect the repo ROOT (they COPY ArkadeHeroes.slnx,
      # src/ and external/dotnet-sdk/). A `.` here would hand them deploy/dokploy/ and the
      # first COPY would fail.
      context: ../..
      dockerfile: src/ArkadeHeroes.Server/Dockerfile
    restart: unless-stopped
    volumes:
      # Holds game.db AND the treasury wallet's derived keys. Losing this volume loses the
      # treasury and every hero. Back it up before any destructive Dokploy action.
      - arkade-state:/data
    environment:
      # BOTH are required. appsettings.json ships "Urls": "http://localhost:5210", which
      # OUTRANKS ASPNETCORE_URLS — set only one and Kestrel binds localhost and the
      # container is unreachable from Traefik. (The image sets Urls too; this is explicit
      # so a future appsettings change cannot quietly re-break it.)
      ASPNETCORE_URLS: http://0.0.0.0:8080
      Urls: http://0.0.0.0:8080
      ASPNETCORE_ENVIRONMENT: Production
      Logging__LogLevel__Default: Information

      # ── Chain: MUTINYNET ────────────────────────────────────────────────
      # NArk, never InMemory. InMemory exposes /api/dev/* — free minting, free treasury
      # funding, free invoice settlement. Public InMemory is an open vault.
      Chain__Mode: NArk
      # Endpoints from the Arkade SDK's own ArkNetworkConfig.Mutinynet
      # (external/dotnet-sdk → NArk.Core/Hosting/ServiceCollectionExtensions.cs).
      Chain__NArk__ArkUri: https://mutinynet.arkade.sh
      Chain__NArk__EsploraUri: https://mempool.mutinynet.arkade.sh/api
      # Covenant co-signer. No hosted mutinynet instance is published in the SDK's network
      # config, so it runs beside us below. Every covenant path — breeding, merging,
      # marketplace offers, death-match and wager escrows — fails without it.
      Chain__NArk__EmulatorUri: http://emulator:7073
      Chain__NArk__DbPath: /data/arkade-heroes-chain.db

      # *** TREASURY SEED PHRASE — set in Dokploy → Environment, NEVER here. ***
      # Empty is the SAFE default: the app generates a mnemonic on first boot and persists
      # it to the volume above. Set it only to RESTORE an existing treasury. Anyone who can
      # read this value can spend the treasury, and every image layer is world-readable to
      # anyone who can pull the image.
      Chain__NArk__TreasuryMnemonic: ${TREASURY_MNEMONIC:-}

      # ── Durability ──────────────────────────────────────────────────────
      Game__StateDbPath: /data/game.db
      Game__HeroFlushInterval: ${HERO_FLUSH_INTERVAL:-00:00:15}
      # Stable receipt-signing key. Empty = a NEW ephemeral key per process, so every
      # receipt signed before a restart stops verifying. Set it in Dokploy (it is a private
      # key): openssl rand -hex 32
      Game__ReceiptKeyHex: ${RECEIPT_KEY_HEX:-}

      # ── Public-deployment policy ────────────────────────────────────────
      # ON for anything public: without it the browser's terms gate is cosmetic and any API
      # client walks straight past it into minting.
      Game__RequireTermsAcceptance: ${REQUIRE_TERMS_ACCEPTANCE:-true}
      # Regtest pacing defaults are far too fast for a shared deployment. The gauntlet is
      # the only XP mint, so its cooldown is the rate limit on the whole XP faucet.
      Game__GauntletCooldown: ${GAUNTLET_COOLDOWN:-00:10:00}
      Game__BreedingCooldownBaseUnit: ${BREEDING_COOLDOWN_BASE_UNIT:-01:00:00}

      # ── Treasury solvency ───────────────────────────────────────────────
      # The daily faucet clamps to (balance − floor), so emission can never drain past it.
      # Mutinynet sats are test coins, but the governor is what you want exercised BEFORE
      # the same config runs anywhere the sats are real.
      Game__TreasuryReserveFloorSats: ${TREASURY_RESERVE_FLOOR_SATS:-100000}
      Game__ReserveSeasonPot: ${RESERVE_SEASON_POT:-true}
    healthcheck:
      # Proves the chain service actually resolved, not merely that the process is up.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/chain/info || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ── Arkade Script emulator (covenant co-signing) ──────────────────────────
  emulator:
    # Upstream Arkade image — pulled, not built. Nothing here to build from source.
    image: ghcr.io/arkade-os/emulator:v0.0.3
    restart: unless-stopped
    # Internal only — it co-signs covenants for the server and has no business being
    # reachable from the internet. Give it no Dokploy domain.
    expose:
      - "7073"

  # ── Blazor WASM frontend (static files behind nginx) ──────────────────────
  web:
    build:
      context: ../..          # repo root, same reason as the server above
      dockerfile: src/ArkadeHeroes.Web/Dockerfile
    restart: unless-stopped
    depends_on:
      - server
    environment:
      # The origin the BROWSER uses. Same host as the site itself, because /api is routed
      # to the server — that is what keeps this same-origin and CORS irrelevant. A compose
      # service name here would resolve to nothing on the player's machine.
      API_BASE_URL: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN, e.g. https://heroes.example.com}
      # Which network the IN-BROWSER, non-custodial wallet dials. The wallet talks to arkd
      # directly, so this must match the server's chain above or players will be signing
      # against a different network than the game is settling on. An unknown value refuses
      # to start rather than defaulting.
      ARK_NETWORK: mutinynet
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  arkade-state:
